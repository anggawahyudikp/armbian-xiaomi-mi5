# Wi-Fi is the primary server uplink; managed Ethernet stays connected as backup.
# Lower route metrics win. Apply to both IP families and any interface name.
# These defaults apply when a connection profile leaves route-metric at -1.
[connection-wifi]
match-device=type:wifi
# Board data contains a shared template address. Generate a stable identity
# locally unless the user's profile explicitly supplies its own MAC address.
wifi.cloned-mac-address=stable
ipv4.route-metric=100
ipv6.route-metric=100

[connection-ethernet]
match-device=type:ethernet
ipv4.route-metric=600
ipv6.route-metric=600
