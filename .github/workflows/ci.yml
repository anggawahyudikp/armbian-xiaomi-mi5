name: Host checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot and installer safety
        run: bash tests/boot/run.sh
      - name: Server policy and diagnostics
        run: python3 -m unittest discover -s tests/server
      - name: Network policy
        run: |
          mkdir -p out
          parent_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- python3 tests/network/test-route-failover.py \
            rootfs-overlay/etc/NetworkManager/conf.d/20-gemini-priority.conf \
            --parent-netns "$parent_netns" --report out/network-route-validation.json
      - name: Stability recorder logic
        run: python3 -m unittest discover -s tests/stability
      - name: Wi-Fi flow
        run: bash tests/wifi-flow/run.sh
